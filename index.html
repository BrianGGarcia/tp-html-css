<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">   
</head>
<body>
    <div class="card">
        <header>
            <img src="./assets/images/logo.png" alt="imagen del logo principal">
            <p>Character Counter</p>
            <button>
                <img src="./assets/images/theme-button.png" alt="imagen boton para cambiar theme">
            </button>
        </header>

        <section class="hero">
            <h1>Analyze your text in real-time</h1>
            <textarea placeholder="Start typing here... (or paste your text)">Desing os the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great desing transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.</textarea>
        </section>

        <section class="controls">
            <label>
                <input type="checkbox">Exclude Spaces
            </label>
            <label>
                <input type="checkbox">Set Character Limit
            </label>
            <p>Approx. reading time: &lt;1 minute</p>
        </section>

        <section class="metrics">
            <div class="total-characters">
                <p class="number">278</p>
                <p>Total Characters</p>
            </div>
            <div class="word-count">
                <p class="number">39</p>
                <p>Word Count</p>
            </div>
            <div class="sentence-count">
                <p class="number">04</p>
                <p>Sentence Count</p>
            </div>
        </section>

        <section class="letter-density">
            <h3>Letter Density</h3>
            <div class="density-list">
                <div class="density-e">
                    <p>E</p>
                    <progress value="16.06" max="100"></progress>
                    <p>40 (16.06%)</p>
                </div>
                <div class="density-i">
                    <p>I</p>
                    <progress value="11.65" max="100"></progress>
                    <p>29 (11.65%)</p>
                </div>
                <div class="density-t">
                    <p>T</p>
                    <progress value="11.24" max="100"></progress>
                    <p>28 (11.24%)</p>
                </div>
                <div class="density-o">
                    <p>O</p>
                    <progress value="8.84" max="100"></progress>
                    <p>22 (8.84%)</p>
                </div>
                <div class="density-n">
                    <p>N</p>
                    <progress value="8.43" max="100"></progress>
                    <p>21 (8.43%)</p>
                </div>
            </div>
        </section>

        <button class="see-more">See more ˅</button>
    </div>
</body>
</html>
